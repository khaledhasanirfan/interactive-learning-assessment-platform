<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" />
      <stop offset="0.5" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Chip Container -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- CPU Connection Pins -->
  <rect x="10" y="1" width="3" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="18" y="1" width="3" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="27" y="1" width="3" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="35" y="1" width="3" height="3" rx="1.5" fill="#38bdf8"/>

  <rect x="10" y="44" width="3" height="3" rx="1.5" fill="#34d399"/>
  <rect x="18" y="44" width="3" height="3" rx="1.5" fill="#34d399"/>
  <rect x="27" y="44" width="3" height="3" rx="1.5" fill="#34d399"/>
  <rect x="35" y="44" width="3" height="3" rx="1.5" fill="#34d399"/>

  <!-- Inner Chip Screen -->
  <rect x="8" y="8" width="32" height="32" rx="9" fill="url(#faceGrad)"/>

  <!-- Eyes with Sparkle -->
  <ellipse cx="17" cy="21" rx="3.2" ry="4.2" fill="#0f172a"/>
  <circle cx="18.2" cy="19.5" r="1.3" fill="#ffffff"/>
  <circle cx="16.2" cy="23" r="0.6" fill="#ffffff"/>

  <ellipse cx="31" cy="21" rx="3.2" ry="4.2" fill="#0f172a"/>
  <circle cx="32.2" cy="19.5" r="1.3" fill="#ffffff"/>
  <circle cx="30.2" cy="23" r="0.6" fill="#ffffff"/>

  <!-- Cheerful Smile -->
  <path d="M20 28 C22 31, 26 31, 28 28" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cute Rosy Cheeks -->
  <circle cx="12.5" cy="25.5" r="2" fill="#f43f5e" opacity="0.45"/>
  <circle cx="35.5" cy="25.5" r="2" fill="#f43f5e" opacity="0.45"/>

  <!-- Little Head Antenna/Kernel Indicator -->
  <circle cx="24" cy="12" r="1.5" fill="#10b981"/>
</svg>
